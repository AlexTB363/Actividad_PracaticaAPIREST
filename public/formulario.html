<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link

        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <link rel="stylesheet" href="style.css">

</head>



<body>
    <header>
        <nav class="navbar navbar-expand-md navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="inicio.html">
                    Mi sitio web
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Mostrar navegación"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                aria-current="page"
                                href="inicio.html"
                            >
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="tags.html">
                                Etiquetas HTML
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="profile.html">
                                Mi perfil
                            </a>
                        </li>
                    <li class="nav-item"><a class="nav-link" href="formulario.html">Formulario</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

        <main class="container py-5">
        <section class="card border-0 shadow p-4">
            <h1>Formulario</h1>
            <form onsubmit="enviarFormulario(event)">
                <fieldset class="mb-4">
                    <legend class="h5">Selecciona una modalidad</legend>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="presencial" name="modalidad" value="presencial" onchange="mostrarModalidad()" required>
                        <label class="form-check-label" for="presencial">Presencial</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="virtual" name="modalidad" value="virtual" onchange="mostrarModalidad()" required>
                        <label class="form-check-label" for="virtual">Virtual</label>
                    </div>
                    <p id="contenido-modalidad" class="mt-3" hidden></p>
                </fieldset>
                <div class="mb-3">
                    <label class="form-label" for="pais">País</label>
                    <select class="form-select" id="pais" onchange="cargarRegiones()" required disabled>
                        <option value="">Selecciona un país</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="region">Región</label>
                    <select class="form-select" id="region" required disabled>
                        <option value="">Selecciona una región</option>
                    </select>
                </div>
                <p id="error-paises" class="text-danger" role="alert"></p>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terminos" onchange="activarBoton()" required>
                    <label class="form-check-label" for="terminos">Acepto los términos</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="datos" onchange="activarBoton()" required>
                    <label class="form-check-label" for="datos">Confirmo que mis datos son correctos</label>
                </div>
                <button class="btn btn-primary" id="enviar" type="submit" disabled>Enviar</button>
                <p id="resultado" class="text-success mt-3" role="status"></p>
            </form>
        </section>
    </main>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
></script>
<script src="script.js"></script>
</body>
</html>
